# SonarQube Project Configuration
sonar.projectKey=ai_tutor_master
sonar.projectName=AI Tutor Master Backend
sonar.projectVersion=1.0.0

# Path to source and test directories
sonar.sources=app
sonar.tests=tests

# File Encodings & Language Configuration
sonar.sourceEncoding=UTF-8
sonar.language=py
sonar.python.version=3.11, 3.12

# Coverage Report Path (generated by pytest-cov)
sonar.python.coverage.reportPaths=coverage.xml

# Exclusions
sonar.exclusions=**/__pycache__/**, **/*.pyc, migrations/**, samples/**, .venv/**
